name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v2.0.0
  workflow_dispatch:  # Manual trigger option

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download && go mod verify

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            # For manual dispatch, build only (no release)
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "Version check skipped - this is not a tagged release"
          fi

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -v -o WindowsNetworkManager.exe .
          ls -lh WindowsNetworkManager.exe
          file WindowsNetworkManager.exe || true

      - name: Create dist directory
        run: |
          mkdir -p dist
          echo "Created dist directory"

      - name: Copy files to dist
        run: |
          echo "Copying files to dist directory..."
          cp WindowsNetworkManager.exe dist/
          if [ -f "vendor/windivert/WinDivert.dll" ]; then
            cp vendor/windivert/WinDivert.dll dist/
            echo "✓ WinDivert.dll copied from vendor directory"
          else
            echo "ERROR: WinDivert.dll not found in vendor/windivert/"
            echo "Please ensure WinDivert.dll is committed in vendor/windivert/"
            exit 1
          fi
          if [ -f "vendor/windivert/WinDivert64.sys" ]; then
            cp vendor/windivert/WinDivert64.sys dist/
            echo "✓ WinDivert64.sys copied from vendor directory"
          else
            echo "ERROR: WinDivert64.sys not found in vendor/windivert/"
            echo "Please ensure WinDivert64.sys is committed in vendor/windivert/"
            exit 1
          fi
          cp -r web dist/
          cp scripts/windows/*.bat dist/
          echo "✓ All files copied to dist directory"
          ls -lh dist/

      - name: Create release bundle
        if: steps.version.outputs.is_tag == 'true'
        run: |
          cd dist
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="WindowsNetworkManager-v${VERSION}.zip"
          zip -r "${ZIP_NAME}" WindowsNetworkManager.exe WinDivert.dll WinDivert64.sys web/ install_service.bat uninstall_service.bat start_service.bat stop_service.bat configure_firewall.bat install_windivert_driver.bat reinstall_windivert_driver.bat service_status.bat view_logs.bat check_architecture.bat check_admin_privileges.bat run_manual.bat run_manual_port.bat 2>/dev/null || zip -r "${ZIP_NAME}" WindowsNetworkManager.exe WinDivert.dll WinDivert64.sys web/ install_service.bat uninstall_service.bat start_service.bat stop_service.bat configure_firewall.bat service_status.bat view_logs.bat check_architecture.bat check_admin_privileges.bat run_manual.bat run_manual_port.bat
          ls -lh "${ZIP_NAME}"
          cd ..
          echo "ZIP created: dist/${ZIP_NAME}"

      - name: Upload build artifacts (manual dispatch only)
        if: steps.version.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            WindowsNetworkManager.exe
            WinDivert.dll
            WinDivert64.sys
          retention-days: 7

      - name: Create Release
        if: steps.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Windows Network Manager ${{ steps.version.outputs.version }}
            
            ### Installation
            1. Download `WindowsNetworkManager-v${{ steps.version.outputs.version }}.zip`
            2. Extract the ZIP file
            3. Right-click `install_service.bat` → Run as Administrator
            4. Right-click `start_service.bat` → Run as Administrator (to start the service)
            5. Access web interface at http://localhost:18080
            
            ### Files Included
            - `WindowsNetworkManager.exe` - Main application
            - `WinDivert.dll` - Required library (WinDivert 2.2.0)
            - `WinDivert64.sys` - WinDivert kernel driver (required)
            - `web/` - Web interface files (index.html, static/app.js)
            - `install_service.bat` - Install Windows service (run as Administrator)
            - `uninstall_service.bat` - Uninstall Windows service (run as Administrator)
            - `start_service.bat` - Start Windows service (run as Administrator)
            - `stop_service.bat` - Stop Windows service (run as Administrator)
            - `configure_firewall.bat` - Configure Windows Firewall (run as Administrator)
            
            ### Quick Install
            See [GitHub Pages](https://hihanifm.github.io/WindowsNetworkManager/) for quick installation instructions.
          files: |
            dist/WindowsNetworkManager.exe
            dist/WinDivert.dll
            dist/WinDivert64.sys
            dist/WindowsNetworkManager-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
