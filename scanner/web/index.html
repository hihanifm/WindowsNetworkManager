<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Network Manager Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .scan-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }

        .scan-button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .scan-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f8fafc;
            border-left: 4px solid #667eea;
        }

        .status.scanning {
            border-left-color: #10b981;
        }

        .status.error {
            border-left-color: #ef4444;
            background: #fee2e2;
        }

        .instances-list {
            margin-top: 30px;
        }

        .instance-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .instance-ip {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .instance-status {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-running {
            background: #d1fae5;
            color: #065f46;
        }

        .status-stopped {
            background: #fee2e2;
            color: #991b1b;
        }

        .instance-details {
            color: #666;
            margin: 10px 0;
        }

        .open-button {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .open-button:hover {
            background: #059669;
        }

        .no-instances {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .progress {
            margin-top: 10px;
            color: #666;
        }

        .progress-bar-container {
            width: 100%;
            height: 24px;
            background: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 12px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.3s ease;
            border-radius: 12px;
        }

        .progress-bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: 600;
            color: #333;
            z-index: 1;
        }

        .version-info {
            text-align: right;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
        }

        .version-label {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔍 Windows Network Manager Scanner</h1>
            <p class="subtitle">Discover Windows instances on your network</p>

            <button id="scanButton" class="scan-button" onclick="startScan()">
                Scan Network
            </button>

            <div id="status" class="status" style="display: none;"></div>
        </div>

        <div class="card instances-list">
            <h2>Discovered Instances</h2>
            <div id="instances"></div>
            <div class="version-info">
                <span class="version-label">Scanner Version:</span> <span id="scannerVersion">-</span>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
